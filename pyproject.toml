[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-predict"
version = "0.1.0"
description = "Honestly-backtested NFL moneyline/spread/total prediction system"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "nfl_data_py==0.3.3",
    "pandas>=1.5,<2.0",
    "numpy<2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
    "fastparquet>=2023.10.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
